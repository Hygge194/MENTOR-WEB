<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Dashboard | Quản lý lịch dạy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body>
    <div class="min-h-screen flex">
        <aside class="w-64 bg-white border-r hidden md:block">
            <div class="p-6">
                <h1 class="text-xl font-extrabold text-indigo-600">MENTOR PLATFORM</h1>
            </div>
            <nav class="mt-6 px-4">
                <a href="#" class="flex items-center p-3 bg-indigo-50 text-indigo-700 rounded-xl font-bold">
                    <span class="mr-3">📅</span> Quản lý yêu cầu
                </a>
                <button onclick="localStorage.removeItem('accessToken'); window.location.href='login.html'" class="w-full flex items-center p-3 text-red-500 mt-10 hover:bg-red-50 rounded-xl transition">
                    <span class="mr-3">🚪</span> Đăng xuất
                </button>
            </nav>
        </aside>

        <main class="flex-1 p-6 md:p-10">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h2 class="text-2xl font-black text-gray-800">Bảng điều khiển Mentor</h2>
                    <p class="text-gray-500 text-sm">Quản lý các yêu cầu học tập mới nhất của bạn.</p>
                </div>
                <div class="bg-white px-6 py-4 rounded-3xl shadow-sm border border-indigo-100 flex items-center">
                    <div class="mr-4 bg-indigo-100 p-3 rounded-2xl text-xl">💰</div>
                    <div>
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Tổng thu nhập</p>
                        <h3 id="total-revenue" class="text-xl font-black text-indigo-600">0đ</h3>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-[2rem] shadow-xl shadow-gray-200/50 overflow-hidden border border-gray-100">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="bg-gray-50/50 border-b border-gray-100">
                                <th class="px-6 py-5 text-[11px] font-black text-gray-400 uppercase tracking-wider">Học viên</th>
                                <th class="px-6 py-5 text-[11px] font-black text-gray-400 uppercase tracking-wider">Gói học & Giá</th>
                                <th class="px-6 py-5 text-[11px] font-black text-gray-400 uppercase tracking-wider">Thời gian đăng ký</th>
                                <th class="px-6 py-5 text-[11px] font-black text-gray-400 uppercase tracking-wider text-center">Trạng thái / Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="mentor-booking-list" class="divide-y divide-gray-50">
                            <tr>
                                <td colspan="4" class="p-10 text-center text-gray-400">Đang tải dữ liệu...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/mentor-dashboard.js"></script>
</body>
</html>
