<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Dashboard | Quản lý lịch dạy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body>
    <div class="min-h-screen flex">
        <aside class="w-64 bg-white border-r hidden md:block">
            <div class="p-6">
                <h1 class="text-xl font-extrabold text-indigo-600">MENTOR PLATFORM</h1>
            </div>
            <nav class="mt-6 px-4">
                <a href="#" class="flex items-center p-3 bg-indigo-50 text-indigo-700 rounded-xl font-bold">
                    <span class="mr-3"></span> Quản lý yêu cầu
                </a>
                <button onclick="localStorage.removeItem('accessToken'); window.location.href='login.html'" class="w-full flex items-center p-3 text-red-500 mt-10 hover:bg-red-50 rounded-xl transition">
                    <span class="mr-3"></span> Đăng xuất
                </button>
            </nav>
        </aside>
<main class="flex-1 p-6 md:p-10 overflow-y-auto">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
        <div>
            <h2 class="text-2xl font-black text-gray-800">Bảng điều khiển Mentor</h2>
            <p class="text-gray-500 text-sm">Quản lý các yêu cầu học tập mới nhất của bạn.</p>
        </div>
        
        <div class="flex flex-wrap gap-4 items-center">
            <button onclick="linkGoogleCalendar()" class="bg-indigo-100 text-indigo-700 px-5 py-3 rounded-2xl font-bold flex items-center gap-2 hover:bg-indigo-200 transition shadow-sm border border-indigo-200 h-14">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/></svg> 
                Liên kết Calendar
            </button>

            <div class="bg-white px-6 py-3 rounded-2xl shadow-sm border border-indigo-100 flex items-center h-14">
                <div class="mr-4 bg-indigo-100 p-2 rounded-xl text-indigo-600">💰</div>
                <div>
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest leading-none">Tổng thu nhập</p>
                    <h3 id="total-revenue" class="text-lg font-black text-indigo-600">0đ</h3>
                </div>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-[2rem] shadow-xl shadow-gray-200/50 overflow-hidden border border-gray-100">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50/50 border-b border-gray-100">
                        <th class="px-6 py-5 text-[11px] font-black text-gray-400 uppercase tracking-wider">Học viên</th>
                        <th class="px-6 py-5 text-[11px] font-black text-gray-400 uppercase tracking-wider">Gói học & Giá</th>
                        <th class="px-6 py-5 text-[11px] font-black text-gray-400 uppercase tracking-wider">Thu nhập (Sau phí)</th>
                        <th class="px-6 py-5 text-[11px] font-black text-gray-400 uppercase tracking-wider">Ngày đăng ký</th>
                        <th class="px-6 py-5 text-[11px] font-black text-gray-400 uppercase tracking-wider">Lịch học</th>
                        <th class="px-6 py-5 text-[11px] font-black text-gray-400 uppercase tracking-wider text-center">Hành động</th>
                    </tr>
                </thead>
                <tbody id="mentor-booking-list" class="divide-y divide-gray-50">
                    <tr>
                        <td colspan="6" class="p-20 text-center">
                            <div class="flex flex-col items-center gap-2">
                                <div class="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                                <p class="text-gray-400 font-medium">Đang tìm kiếm yêu cầu mới...</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>


    <script src="js/auth.js"></script>
    <script src="js/mentor-dashboard.js"></script>
</body>
</html>
